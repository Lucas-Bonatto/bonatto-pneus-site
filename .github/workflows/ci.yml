name: Verificação de segurança e qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Auditar, compilar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Instalar dependências bloqueadas pelo lockfile
        run: npm ci

      - name: Auditar vulnerabilidades
        run: npm audit --audit-level=high

      - name: Compilar o site
        run: npm run build

      - name: Executar testes
        run: npm test

      - name: Validar pacote do Cloudflare
        run: npx wrangler deploy --dry-run
